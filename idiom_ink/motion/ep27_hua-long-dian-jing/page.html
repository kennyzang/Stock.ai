function drawAnswerCard(t, s, a = 1) {
  const S = answerPieces(); if (s <= 0) return;

  put(S.card, 1.8); put(S.badge, .8);
  const l = LN.A_N, u = clamp((t - l.t0) / (l.t1 - l.t0 - .25)), tot = S.lines[0].len + S.lines[1].len;   // words darken as A_N reads them
  S.lines.forEach((ln, k) => {
    put(ln.dim, 0);
    const done = clamp((u * tot - (k ? S.lines[0].len : 0)) / ln.len); if (done <= 0) return;
    X.save(); X.beginPath(); X.rect(ln.on.x0, ln.on.y0, ln.on.w * done, ln.on.h); X.clip(); put(ln.on, .5); X.restore();
  });
  X.restore(); X.globalAlpha = 1;
  drawSeal(S.cx + S.w / 2 * s - 44, S.cy - S.h / 2 * s + 10, .95 * s);
}

function render(t) {
  CUR_T = t; SHAKE = 0; CAM_DY = (t >= SC.lock.t0 && t < SC.reveal.t0) ? 96 : 0;
  X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, W, H); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; shadowOff();
  const inS = k => t >= SC[k].t0 && t < SC[k].t1;
  if (t < SC.quiz.t1) { drawQuiz(t, true); }
  else if (inS('lock')) sceneLock(t);
  else if (inS('S1')) sceneS1(t);
  else if (inS('S2')) sceneS2(t);
  else if (inS('turn')) sceneTurn(t);
  else if (inS('S3')) sceneS3(t);
  else if (inS('S4')) sceneS4(t);
  else if (inS('reveal')) sceneReveal(t);
  else if (inS('slam')) sceneSlam(t);
  else if (inS('answer')) sceneAnswer(t);
  else if (inS('usage')) sceneUsage(t);
  else if (inS('close')) sceneClose(t);
  else { drawQuiz(t - SC.loop.t0, false); }   // loop: hard cut back to exactly the quiz frame
  const story = t >= SC.S1.t0 && t < SC.reveal.t0;
  if (story) drawBar(t);
  screen();
  if (t >= SC.lock.t0 && t < SC.reveal.t0) drawCaption(t);   // S1's first words start while the options settle
}
