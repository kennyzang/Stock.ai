<script>

const C = document.getElementById('c'), x = C.getContext('2d');
const INK = '#1E1A2B', WHITE = '#FFFFFF', CREAM = '#FFF4DC';
const K = { yellow:'#FFD23F', orange:'#FF9F43', red:'#FF5A4E', pink:'#FF5FA2', green:'#3BC46A', lime:'#A6E04B',

const LI = { col:'#5E7FB8', dark:'#45649A' };   // Li slate-blue

// ---------- easing / grid ----------
const BPM = 120, BEAT = 60 / BPM;

const backOut = p => { const s = 2.2; p -= 1; return p * p * ((s + 1) * p + s) + 1; };

// ---------- drawing kit ----------
function ink(lw) { x.lineWidth = lw; x.strokeStyle = INK; x.lineJoin = 'round'; x.lineCap = 'round'; }
function shape(path, fill, lw = 8, sh = 10) {

// telop text: ink stroke painted under the fill, optional hard shadow

function textW(str, size, font) { x.font = `${size}px ${font}`; return x.measureText(str).width; }
// segments: [[text, fill, size]] laid out centred on one baseline
function telRow(segs, cx, Y, font, o = {}) {

}

// ---------- sets ----------
function stripes(bg, fg, t, w = 64, speed = 30) {

function sunburst(bg, fg, cx, cy, rot, n = 22) {

// ---------- bean mascot ----------
function beanPath(w, h) {

// ---------- props ----------

  shape(foot, GD, 7, 0);

  x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(-52, 0); x.quadraticCurveTo(-50, -24, -34, -36); x.stroke();

// snake path points (for frame B)
function snakePts(x0, y0, len, amp, n = 60) { const p = []; for (let i = 0; i <= n; i++) { const u = i / n; p.push([x0 + u * len, y0 + Math.sin(u * Math.PI * 2.3) * amp * (0.6 + 0.4 * u)]); } return p; }

function snake(p, bodyW, col, feet) {

    tel('Guess the meaning', 450, 604, 46, FRED, WHITE, { sw: 0, sh: 0 });
    const ay = 590 + Math.sin(t * Math.PI * 4) * 4; // bobbing arrow
    shape(() => { x.beginPath(); x.moveTo(680, ay - 22); x.lineTo(706, ay - 22); x.lineTo(706, ay + 2); x.lineTo(722, ay + 2); x.lineTo(693, ay + 28); x.lineTo(664, ay + 2); x.lineTo(680, ay + 2); x.closePath(); }, K.yellow, 4, 0);
  });
  // --- the four tiles ---
  const chars = ['画', '蛇', '添', '足'], py = ['huà', 'shé', 'tiān', 'zú'], gl = ['draw', 'snake', 'add', 'feet'];
  const cols = [K.pink, K.orange, K.purple, K.blue], icons = ['brush', 'snake', 'plus', 'foot'];
  const tw = 196, gap = 12, tx0 = 60, ty = 640, th = 326;
  for (let i = 0; i < 4; i++) {
    const X = tx0 + i * (tw + gap), cx = X + tw / 2, t0 = 0.3 + i * 0.08;
    const s = pop(t, t0), dy = hop(t, i * 0.5, 6) * (t > 1.2 ? 1 : 0);
    scaled(cx, ty + th / 2, s, (i % 2 ? 0.025 : -0.025), () => {
      x.save(); x.translate(0, dy);
      shape(rrP(X, ty, tw, th, 30), cols[i], 8, 14);
      tel(py[i], cx, ty + 46, 34, '"DejaVu Sans"', WHITE, { sw: 0.2, sh: 0 });
      tel(chars[i], cx, ty + 210, 166, HANZI, WHITE, { sw: 0.13, sh: 0.05, bold: 5 });
      icon(icons[i], cx, ty + 252, 34);
      // gloss chip
      tel(gl[i], cx + 0, ty + 312, 32, FRED, WHITE, { sw: 0.2, sh: 0 });
      x.restore();
    });
  }
  // "+" sticker joining note: a star sticker

  // --- countdown ring + contestants ---
  const rcx = 540, rcy = 1078, R = 82;
  const ringS = pop(t, 0.7, 0.26);
  // contestants
  const zs = pop(t, 0.55), ls = pop(t, 0.65);
  const podium = (cx, col) => { shape(rrP(cx - 105, 1172, 210, 48, 16), col, 7, 8); };
  scaled(250, 1190, zs, 0, () => {
    podium(250, K.yellow);
    bean({ X: 250, Y: 1168 + hop(t, 0, 14), w: 128, h: 172, c: ZH, acc: 'topknot', flutter: Math.sin(t * 9) * 4, eyes: 'dot', mouth: 'O', brows: -1,
      arms: [{ side: -1, to: [-96, -150] }, { side: 1, to: [44, -66], front: true }] });
    // thought "?" sticker
    shape(circP(372, 1018, 32), WHITE, 6, 6); tel('?', 372, 1037, 52, LIL, K.pink, { sw: 0, sh: 0 });
    tel('ZHANG', 250, 1212, 28, FRED, INK, { sw: 0, sh: 0 });
  });
  scaled(810, 1190, ls, 0, () => {
    podium(810, K.lime);
    bean({ X: 810, Y: 1168 + hop(t, 0.5, 14), w: 158, h: 160, c: LI, acc: 'headband', beard: true, eyes: 'happy', mouth: 'open', brows: 1,
      arms: [{ side: -1, to: [-96, -156] }, { side: 1, to: [92, -156] }] });
    tel('LI', 810, 1212, 28, FRED, INK, { sw: 0, sh: 0 });
  });
  scaled(rcx, rcy, ringS, 0, () => {
    // burst rays behind the ring
    x.save(); x.translate(rcx, rcy); x.rotate(t * 0.8); x.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = 0; i < 12; i++) { x.rotate(Math.PI / 6); x.beginPath(); x.moveTo(0, 0); x.lineTo(160, -22); x.lineTo(160, 22); x.closePath(); x.fill(); }
    x.restore();
    shape(circP(rcx, rcy, R + 22), WHITE, 8, 12);
    const left = clamp(3 - (t - 0.7), 0, 3), f = left / 3;
    x.lineCap = 'round'; x.strokeStyle = '#E8E2F4'; x.lineWidth = 24; x.beginPath(); x.arc(rcx, rcy, R - 4, 0, 7); x.stroke();
    x.strokeStyle = K.pink; x.beginPath(); x.arc(rcx, rcy, R - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); x.stroke();
    ink(5); x.beginPath(); x.arc(rcx, rcy, R - 18, 0, 7); x.stroke(); x.beginPath(); x.arc(rcx, rcy, R + 10, 0, 7); x.stroke();
    // tick dots
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; x.beginPath(); x.arc(rcx + Math.cos(a) * (R + 22), rcy + Math.sin(a) * (R + 22), 0, 0, 7); }
    const n = Math.max(1, Math.ceil(left)), ps = 1 + 0.25 * (1 - pop(t, 0.7 + (3 - n), 0.2));
    scaled(rcx, rcy, ps, 0, () => tel(String(n), rcx - 10, rcy + 44, 128, LIL, INK, { sw: 0, sh: 0 }));
    for (let i = 0; i < 3; i++) { x.beginPath(); x.arc(rcx + 32 + i * 15, rcy + 38, 5.5, 0, 7); x.fillStyle = K.pink; x.fill(); }
  });
  // --- answer buttons ---
  const ans = [['A', 'Overdoing it', K.pink], ['B', 'Being lucky', K.yellow], ['C', 'Drawing well', K.lime]];
  const bx = 110, bw = 740, bh = 70, by0 = 1242;
  ans.forEach((a, i) => {
    const Y = by0 + i * (bh + 14), s = pop(t, 0.55 + i * 0.08);
    scaled(bx + bw / 2, Y + bh / 2, s, 0, () => {
      shape(rrP(bx, Y, bw, bh, bh / 2), WHITE, 8, 10);
      shape(circP(bx + bh / 2 + 2, Y + bh / 2, bh / 2 - 8), a[2], 6, 0);
      tel(a[0], bx + bh / 2 + 2, Y + bh / 2 + 16, 44, LIL, WHITE, { sw: 0.2, sh: 0 });
      tel(a[1], bx + bh + 22, Y + bh / 2 + 16, 46, FRED, INK, { align: 'left', sw: 0, sh: 0 });
    });
  });
}

// ================= FRAME B: variety-show replay =================
function frameB(t) {
  const tb = t - 8; // local time; scene starts at 8 s
  sunburst(K.yellow, '#FFE27A', 640, 700, tb * 0.25, 20);
  // ground
  const gy = 870;
  x.fillStyle = '#E3A869'; x.fillRect(0, gy, 1080, 1920 - gy); ink(8); x.beginPath(); x.moveTo(0, gy); x.lineTo(1080, gy); x.stroke();
  const rnd = seeded(7);
  for (let i = 0; i < 26; i++) { const px = rnd() * 1080, pyy = gy + 30 + rnd() * 950, r = 8 + rnd() * 16; x.beginPath(); x.ellipse(px, pyy, r * 1.5, r * 0.6, 0, 0, 7); x.fillStyle = '#CF9152'; x.fill(); }
  // scratch marks in dirt near snake
  // --- snake in the dirt (4 tiny feet) ---
  const sp = snakePts(250, 1000, 350, 24);
  const feet = [{ i: 5, len: 14, tilt: 0.25 }, { i: 19, len: 14 }, { i: 33, len: 14 }, { i: 47, len: 14 }];
  // dirt groove shadow under the snake
  x.lineCap = 'round'; polyline(sp.map(q => [q[0] + 6, q[1] + 12])); x.strokeStyle = '#C3854A'; x.lineWidth = 50; x.stroke();
  snake(sp, 30, K.green, feet);
  // foot counter pips
  feet.forEach((f, k) => { const [fx, fy] = f.at, s = pop(t, 8.2 + k * BEAT / 2); scaled(fx, fy + 30, s, 0, () => { shape(circP(fx, fy + 32, 22), k ? K.pink : K.red, 5, 5); tel(String(4 - k), fx, fy + 44, 32, LIL, WHITE, { sw: 0, sh: 0 }); }); });
  // --- Zhang crouched, adding the 4th foot ---
  const f4 = feet[0].at; // he works at the tail end, near him
  // camera brackets (replay framing)
  ink(10); const br = (X, Y, dx, dy) => { x.beginPath(); x.moveTo(X, Y + dy * 60); x.lineTo(X, Y); x.lineTo(X + dx * 60, Y); x.stroke(); };
  x.strokeStyle = WHITE; x.lineWidth = 10;
  // --- speed lines: jug yanked from Zhang to Li ---
  x.save(); x.lineCap = 'round';
  for (let k = 0; k < 3; k++) { x.strokeStyle = INK; x.lineWidth = 9; x.setLineDash([46, 26]); x.lineDashOffset = -tb * 120;
    x.beginPath(); x.moveTo(260, 720 + k * 34); x.quadraticCurveTo(420, 580 + k * 34, 580, 660 + k * 30); x.stroke(); }
  x.restore();
  // Zhang
  const zx = 190, zy = 950;
  bean({ X: zx, Y: zy, w: 170, h: 162, c: ZH, rot: 0.1, acc: 'topknot', flutter: Math.sin(t * 9) * 4, eyes: 'wide', mouth: 'O', brows: -1,
    arms: [{ side: -1, to: [-124, -146] }, { side: 1, to: [112, -36], front: true }],
    extra: () => { // sweat drops
      for (const [dx, dy, s] of [[-108, -150, 1], [-122, -112, 0.7]]) { x.beginPath(); x.moveTo(dx, dy - 22 * s); x.quadraticCurveTo(dx + 14 * s, dy, dx, dy + 10 * s); x.quadraticCurveTo(dx - 14 * s, dy, dx, dy - 22 * s); x.fillStyle = K.sky; x.fill(); ink(4); x.stroke(); }
    } });
  // stick from Zhang's hand to the snake foot
  { const hx = zx + 112 * Math.cos(0.1) - (-36) * Math.sin(0.1), hy = zy + 112 * Math.sin(0.1) + (-36) * Math.cos(0.1);
    x.lineCap = 'round'; ink(18); x.beginPath(); x.moveTo(hx - 10, hy - 22); x.lineTo(f4[0] - 4, f4[1] - 4); x.stroke(); x.strokeStyle = '#B07A3E'; x.lineWidth = 8; x.stroke();
    x.beginPath(); x.arc(hx, hy, 20, 0, 7); x.fillStyle = CREAM; x.fill(); ink(7); x.stroke(); }
  // shock sticker over Zhang
  scaled(150, 680, pop(t, 8.4), -0.15, () => { shape(() => star(150, 680, 70, 50, 10), K.red, 7, 8); tel('!?', 150, 706, 72, LIL, WHITE, { sw: 0.16, sh: 0 }); });
  // Li standing, jug up
  const lx = 790, ly = 1080, lw = 220, lh = 268;
  // burst behind the jug
  const jx = lx - 96, jy = ly - 300 - 64, js = 1 + 0.04 * Math.sin(t * Math.PI * 4);
  scaled(jx, jy, pop(t, 8.0), 0, () => { shape(() => star(jx, jy, 150, 104, 14, tb * 0.3), WHITE, 7, 0); });
  bean({ X: lx, Y: ly, w: lw, h: lh, c: LI, acc: 'headband', beard: true, eyes: 'happy', mouth: 'open', brows: 1,
    arms: [{ side: -1, to: [-96, -300] }, { side: 1, to: [112, -236] }] });
  jug(jx, jy, 1.0 * js, 0.12);
  // Li's front hand on the jug bottom
  shape(circP(lx - 96, ly - 300 + 6, 20), CREAM, 7, 0);
  sparkle(560, 560, 26, WHITE); sparkle(860, 600, 20, WHITE); sparkle(545, 800, 16, WHITE);
  // name tags
  const tag = (X, Y, s, col) => { const w = textW(s, 34, FRED) + 40; shape(rrP(X - w / 2, Y, w, 52, 26), col, 5, 6); tel(s, X, Y + 39, 34, FRED, WHITE, { sw: 0, sh: 0 }); };
  tag(zx - 20, 962, 'ZHANG', INK); tag(lx, ly - 56, 'LI', INK);
  // WIN stamp near Li
  scaled(800, 470, pop(t, 8.6), 0.14, () => { shape(rrP(710, 430, 180, 78, 22), K.lime, 7, 8); tel('WIN!', 800, 490, 58, LIL, WHITE, { sw: 0.18, sh: 0 }); });

  // --- caption sticker ---
  scaled(490, 1260, pop(t, 8.8, 0.26), -0.035, () => {
    shape(rrP(60, 1150, 860, 228, 44), K.pink, 9, 16);
    tel("Snakes don't", 490, 1244, 104, LIL, WHITE, { sw: 0.16, sh: 0.06 });
    telRow([['have ', WHITE, 104], ['FEET!', K.yellow, 132]], 490, 1352, LIL, { sw: 0.16, sh: 0.06 });
  });
  // --- replay chrome ---
  shape(rrP(44, 186, 270, 92, 24), CREAM, 7, 9);
  tel('画蛇添足', 179, 252, 58, HANZI, INK, { sw: 0, sh: 0, bold: 2 });
  shape(rrP(44, 300, 250, 72, 36), INK, 0, 0);
  const blink = (Math.floor(t * 2) % 2) ? 1 : 1;
  x.beginPath(); x.arc(82, 336, 15, 0, 7); x.fillStyle = K.red; x.fill();
  tel('REPLAY', 112, 352, 44, LIL, WHITE, { align: 'left', sw: 0, sh: 0 });
  shape(rrP(306, 304, 108, 64, 20), K.yellow, 6, 6); tel('x0.5', 360, 349, 38, LIL, INK, { sw: 0, sh: 0 });
}

window.render = (t) => {
  x.setTransform(1, 0, 0, 1, 0, 0); x.setLineDash([]);
  // beat punch on the frame
  const p = ((t / BEAT) % 1), punch = 1 + 0.012 * Math.exp(-p * 10);
  x.translate(540, 960); x.scale(punch, punch); x.translate(-540, -960);
  if (t < 8) frameA(t); else frameB(t);
};
Promise.all([
  document.fonts.load('100px Lilita'), document.fonts.load('700 50px Fred'),
  document.fonts.load('200px "LXGW WenKai"', '画蛇添足'), document.fonts.load('36px "DejaVu Sans"', 'huàshétiānzú'),
]).then(() => { window.render(1); window.READY = true; });
</script></body></html>
