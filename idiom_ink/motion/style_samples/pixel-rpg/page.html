// ---------- Idiom Quest: 16-bit pixel RPG frames, 270x480 indexed framebuffer, x4 nearest ----------
const W = 270, H = 480, S = 4;
const HEX = [

 '3e2731','68386c','b55088','f6757a',                             // 7 plumdk,8 plum,9 rose,10 pink
 'a22633','e43b44','f77622','feae34','fee761',                    // 11 deepred,12 red,13 orange,14 gold,15 yellow
 'c28569','e8b796','f8dcc0',                                      // 16 skin sh,17 skin,18 skin hi
 '733e39','b86f50','e4a672','ead4aa',                             // 19 brown dk,20 brown,21 tan,22 cream
 '3a4528','66733a','a3a35a',                                      // 23 bronze dk,24 bronze,25 bronze hi
 '265c42','3e8948','124e89','0099db','2ce8f5',                    // 26 green dk,27 green,28 blue dk,29 blue,30 cyan
 'be4a2f','d77643','4a2a2a','63c74d','1b2a5c'                     // 31 rust,32 rust hi,33 dirt dk,34 green hi,35 box blue dk
];
const PAL = HEX.map(h => [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]);
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + 0.5) / 16);

function buf() { const d = new Int16Array(W * H); d.fill(-1); return d; }
let FB = buf();
function pset(T, x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H || c < 0) return; T[y * W + x] = c; }

function line(T, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, e = dx + dy;
  for (;;) { pset(T, x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
// shaded primitives: ramp = [dark, base, light]
function shadeIdx(ramp, d) { return d > 0.42 ? ramp[2] : d < -0.3 ? ramp[0] : ramp[1]; }
function ellipse(T, cx, cy, rx, ry, ramp) {

  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {

}
function poly(T, pts, ramp) {
  const flat = typeof ramp === 'number';

for (const k in U) defg(k, U[k].split('|'));

function textL(T, s, x, y, sc, col) {

// outlined text with drop shadow, composited onto FB
function text(s, x, y, sc, col, opt = {}) {

// ---------- windows (16-bit blue skin) ----------
function windowBox(x, y, w, h, fill = [28, 35]) {
  const T = buf();
  const r = (i, j) => { // corner rounding
    const cx = i < 3 ? 3 - i : i > w - 4 ? i - (w - 4) : 0, cy = j < 3 ? 3 - j : j > h - 4 ? j - (h - 4) : 0; return cx * cx + cy * cy; };

    const d = r(i, j); if (d > 9) continue;

function cursor(x, y, col = 6) { // ▶ hand-drawn

function palace(T, x, base, sc, c) { // Chu-style hall silhouette with curved eaves
