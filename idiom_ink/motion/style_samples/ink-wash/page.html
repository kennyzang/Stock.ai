<script>
// ===== Idiom Ink: 画蛇添足 in animated ink wash. Everything drawn in Canvas 2D; deterministic in t. =====
const W = 1080, H = 1920;

// ---------- rice paper (cached, procedural) ----------
const PAPER = mkC(), GRAIN = mkC();

    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * L * .5 + (R() - .5) * 10, y + Math.sin(a) * L * .5 + (R() - .5) * 10, x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke();

  for (let i = 0; i < 500; i++) { c.fillStyle = `rgba(110,90,70,${.08 + R() * .18})`; c.beginPath(); c.arc(R() * W, R() * H, .5 + R() * 1.4, 0, 7); c.fill(); }
  for (let i = 0; i < 260; i++) { c.fillStyle = `rgba(255,252,240,${.3 + R() * .4})`; c.beginPath(); c.ellipse(R() * W, R() * H, 1 + R() * 3, .6 + R(), R() * 3, 0, 7); c.fill(); }
})();

// ---------- brush engine ----------
function densify(P, per = 10) {

let SEEDC = 1;

    c.closePath();

// soft ink mass: noisy polygon with gradient [x0,y0,x1,y1,a0,a1]

// smooth closed blob through control points (for robes etc.)

function blot(x, y, r, a, seed = 0, sq = 1, rot = 0, col = INKC, c = I) {

function seal(x, y, s, chars, seed = 3, rot = 0) {
