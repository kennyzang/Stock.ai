<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W = 1080, H = 1920, SS = 2, PI = Math.PI;
const out = document.getElementById('c').getContext('2d');
window.DUR = 12;

// ---------- utils ----------
function cv(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return [c, c.getContext('2d')]; }
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y, P) { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const w = (a, b) => P ? hash(((a % P) + P) % P, ((b % P) + P) % P) : hash(a, b);
  return (w(i, j) * (1 - u) + w(i + 1, j) * u) * (1 - v) + (w(i, j + 1) * (1 - u) + w(i + 1, j + 1) * u) * v; }
const nz1 = (t, s) => vnoise(t, s * 13.7) * 2 - 1;
const DYE = { red: '#b8211a', crim: '#8e1813', verm: '#c8361c', orange: '#d9541c', yellow: '#dfa524', gold: '#c98a26',
  green: '#236e3a', jade: '#2f8a5c', mal: '#1f7a55', teal: '#22647e', slate: '#3f5f86', slate2: '#2f4b70', rust: '#a53e1c',
  hide: '#e4c086', hide2: '#cf9f5e', ink: '#1a100a', brown: '#6b3a1c', white: '#f6eed8', skin: '#efd2a0', bronze: '#5e6a2c', bronze2: '#7a6a2a' };
function mat(x, y, a = 0, sx = 1, sy = 1) { return new DOMMatrix().translate(x, y).rotate(a * 180 / PI).scale(sx, sy); }

// ---------- hide texture ----------
let HIDE = null;
function hideCanvas() {
  if (HIDE) return HIDE;
  const N = 512, [c, g] = cv(N, N), id = g.createImageData(N, N), d = id.data;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const f = vnoise(x / 64, y / 64, 8) * .5 + vnoise(x / 32, y / 32, 16) * .3 + vnoise(x / 8, y / 8, 64) * .2;
    const sp = hash(x, y) > .986 ? .82 : 1;
    const v = (.8 + .24 * f) * sp, i = (y * N + x) * 4;
    d[i] = Math.min(255, v * 255); d[i + 1] = Math.min(255, v * 248); d[i + 2] = Math.min(255, v * 232); d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.globalAlpha = .09; g.strokeStyle = '#5a3a1a'; g.lineWidth = .8;
  for (let k = 0; k < 1100; k++) { const x = hash(k, 1) * N, y = hash(k, 2) * N, a = hash(k, 3) * 6.28, l = 6 + hash(k, 4) * 18; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  HIDE = c; return c;
}
function hideTexture(c, g, seed) {
  const [m, mg] = cv(c.width, c.height); mg.drawImage(c, 0, 0);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const pat = g.createPattern(hideCanvas(), 'repeat'); pat.setTransform(new DOMMatrix([1, 0, 0, 1, (seed * 137) % 512, (seed * 71) % 512]));
  g.globalCompositeOperation = 'multiply'; g.fillStyle = pat; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(m, 0, 0);
  g.restore();
}
let SEED = 1;
function piece(box, draw, opt = {}) {
  const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, K = opt.ss || SS;
  const [c, g] = cv(w * K, h * K);
  g.setTransform(K, 0, 0, K, -x0 * K, -y0 * K); g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g);
  if (opt.tex !== false) hideTexture(c, g, SEED++);

}

// ---------- carving vocabulary ----------
function P(g, pts, closed = true) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); if (closed) g.closePath(); }
function S(g, pts, closed = true) {
  const n = pts.length;
  if (!closed) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); } g.lineTo(pts[n - 1][0], pts[n - 1][1]); return; }
  const m = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const s = m(0); g.moveTo(s[0], s[1]);
  for (let i = 1; i <= n; i++) { const p = pts[i % n], q = m(i); g.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  g.closePath();
}
function fill(g, col, fn, rule = 'nonzero') { g.beginPath(); fn(g); g.fillStyle = col; g.fill(rule); }
function ink(g, w, fn, col = DYE.ink) { g.beginPath(); fn(g); g.strokeStyle = col; g.lineWidth = w; g.stroke(); }
function cut(g, fn, rule = 'nonzero') { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.beginPath(); fn(g); g.fill(rule); g.restore(); }
function cutLine(g, w, fn) { g.save(); g.globalCompositeOperation = 'destination-out'; g.strokeStyle = '#000'; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); fn(g); g.stroke(); g.restore(); }
function within(g, fn, body) { g.save(); g.beginPath(); fn(g); g.clip(); body(); g.restore(); }
function scalesOpen(g, x0, y0, x1, y1, r = 7) {
  cut(g, q => { let row = 0;
    for (let y = y0; y < y1 + r; y += r * .95, row++) for (let x = x0 - r + (row % 2) * r; x < x1 + r; x += r * 2) {
      q.moveTo(x + Math.cos(.08 * PI) * r * .86, y + Math.sin(.08 * PI) * r * .86);
      q.arc(x, y, r * .86, .08 * PI, .92 * PI); q.arc(x, y - r * .18, r * .5, .88 * PI, .12 * PI, true); q.closePath(); } });
}
function lattice(g, x0, y0, x1, y1, s = 10, w = 2.2) {
  cut(g, q => { let row = 0;
    for (let y = y0; y < y1 + s; y += s / 2, row++) for (let x = x0 + (row % 2) * s / 2; x < x1 + s; x += s) {
      const h = s / 2 - w; q.moveTo(x, y - h * .9); q.lineTo(x + h, y); q.lineTo(x, y + h * .9); q.lineTo(x - h, y); q.closePath(); } });
}
function coin(g, x, y, r) { cut(g, q => { q.arc(x, y, r, 0, PI * 2); q.rect(x - r * .38, y - r * .38, r * .76, r * .76); }, 'evenodd'); }
function beads(g, pts, r) { cut(g, q => { for (const [x, y] of pts) { q.moveTo(x + r, y); q.arc(x, y, r, 0, PI * 2); } }); }
function beadLine(g, x0, y0, x1, y1, r, gap) { const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.floor(L / gap)), pts = []; for (let i = 0; i <= n; i++) pts.push([x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]); beads(g, pts, r); }
function cloud(g, x, y, r, rot = 0, w = 1.6, flip = 1) {
  cutLine(g, w, q => { for (let i = 0; i <= 40; i++) { const a = i / 40 * PI * 2.2, rr = r * (1 - i / 40 * .78); const px = x + Math.cos(rot + a * flip) * rr, py = y + Math.sin(rot + a * flip) * rr; if (i === 0) q.moveTo(px, py); else q.lineTo(px, py); } });
  cut(g, q => { q.arc(x + Math.cos(rot + PI * 2.2 * flip) * r * .2, y + Math.sin(rot + PI * 2.2 * flip) * r * .2, r * .17, 0, PI * 2); });
}
function meander(g, x0, y, x1, s = 6, w = 1.4) {
  cutLine(g, w, q => { q.moveTo(x0, y); for (let x = x0; x < x1 - s * 2; x += s * 2) { q.lineTo(x, y - s); q.lineTo(x + s * 1.4, y - s); q.lineTo(x + s * 1.4, y - s * .3); q.lineTo(x + s * .7, y - s * .3); q.lineTo(x + s * .7, y); q.lineTo(x + s * 2, y); } });
}
function cutTaper(g, pts, w) {
  const L = [], R = [], n = pts.length;
  for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; const k = Math.sin(PI * (i / (n - 1))) * .9 + .1, ww = w * k / 2; L.push([pts[i][0] - dy / l * ww, pts[i][1] + dx / l * ww]); R.push([pts[i][0] + dy / l * ww, pts[i][1] - dx / l * ww]); }

}
function inkTaper(g, pts, w, col = DYE.ink) {
  const L = [], R = [], n = pts.length;
  for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; const k = Math.sin(PI * (i / (n - 1))) * .85 + .15, ww = w * k / 2; L.push([pts[i][0] - dy / l * ww, pts[i][1] + dx / l * ww]); R.push([pts[i][0] + dy / l * ww, pts[i][1] - dx / l * ww]); }
  fill(g, col, q => { q.moveTo(...L[0]); for (const p of L) q.lineTo(...p); for (let i = n - 1; i >= 0; i--) q.lineTo(...R[i]); q.closePath(); });
}

// ---------- transmission canvas ----------
const [Tc, T] = cv(W, H);
function place(p, m, alpha = 1) { T.save(); T.globalCompositeOperation = 'multiply'; T.globalAlpha = alpha; T.setTransform(m); T.drawImage(p.c, p.x0, p.y0, p.w, p.h); T.restore(); }
function placeBlur(p, m, blur, alpha = 1) { T.save(); T.filter = `blur(${blur}px)`; place(p, m, alpha); T.restore(); }
function rivet(x, y, r = 4) {
  T.save(); T.setTransform(1, 0, 0, 1, 0, 0); T.globalCompositeOperation = 'multiply';
  T.beginPath(); T.arc(x, y, r * .74, 0, PI * 2); T.strokeStyle = '#2e1c10'; T.lineWidth = r * .55; T.stroke();
  T.beginPath(); T.arc(x, y, r * .45, 0, PI * 2); T.fillStyle = '#c09468'; T.fill(); T.restore();
}
function rod(x, y, ang, len = 520, w = 3.2) {
  // a thin bamboo rod just off the screen: soft, dark-grey, fading toward the operator
  T.save(); T.setTransform(1, 0, 0, 1, 0, 0); T.globalCompositeOperation = 'multiply'; T.filter = 'blur(1.6px)';
  const x2 = x + Math.sin(ang) * len, y2 = y + Math.cos(ang) * len;
  const gr = T.createLinearGradient(x, y, x2, y2); gr.addColorStop(0, 'rgba(70,52,40,.62)'); gr.addColorStop(.7, 'rgba(90,70,55,.35)'); gr.addColorStop(1, 'rgba(90,70,55,0)');
  T.strokeStyle = gr; T.lineWidth = w; T.lineCap = 'round'; T.beginPath(); T.moveTo(x, y); T.lineTo(x2, y2); T.stroke();
  // wire loop at the tip
  T.filter = 'blur(.6px)'; T.beginPath(); T.arc(x, y, 4.5, 0, PI * 2); T.strokeStyle = 'rgba(40,28,20,.8)'; T.lineWidth = 1.8; T.stroke();
  T.restore();
}
const wp = (m, x, y) => { const p = m.transformPoint(new DOMPoint(x, y)); return [p.x, p.y]; };

// ---------- cloth (static) ----------
let CLOTH = null;
function cloth() {
  if (CLOTH) return CLOTH;
  const [c, g] = cv(W, H), id = g.createImageData(W, H), d = id.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const wx = x + vnoise(x / 90, y / 90) * 3, wy = y + vnoise(x / 90 + 7, y / 90) * 3;
    const weave = .5 + .5 * Math.sin(wx * 1.9) * Math.sin(wy * 1.9);
    const blot = vnoise(x / 220, y / 220) * .6 + vnoise(x / 60, y / 60) * .4;
    const fib = hash(x, y) > .993 ? .9 : 1;
    let v = (.955 + .045 * weave - .06 * blot) * fib;
    const i = (y * W + x) * 4; d[i] = 255 * v; d[i + 1] = 252 * v; d[i + 2] = 244 * v; d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0); CLOTH = c; return c;
}
let GRAIN = null;
function grain() {
  if (GRAIN) return GRAIN;
  const [c, g] = cv(W, H), id = g.createImageData(W, H), d = id.data;
  for (let i = 0; i < W * H; i++) { const v = 128 + (hash(i % W, (i / W) | 0) - .5) * 34; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0); GRAIN = c; return c;
}

// ---------- plaques with letters cut out (titles are puppets) ----------
function plaque(w, h, opt) {
  const r = opt.r ?? 16;
  return piece([-w / 2 - 4, -h / 2 - 4, w / 2 + 4, h / 2 + 4], g => {
    const shape = q => { q.roundRect(-w / 2, -h / 2, w, h, r); };
    fill(g, opt.dye || '#2b170d', shape);
    // gold carved line
    g.beginPath(); g.roundRect(-w / 2 + 9, -h / 2 + 9, w - 18, h - 18, Math.max(2, r - 6)); g.strokeStyle = opt.line || '#c9922c'; g.lineWidth = 3; g.stroke();
    if (opt.beads) { beadLine(g, -w / 2 + 26, -h / 2 + 18, w / 2 - 26, -h / 2 + 18, 2.4, 16); beadLine(g, -w / 2 + 26, h / 2 - 18, w / 2 - 26, h / 2 - 18, 2.4, 16); }
    if (opt.corners) for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cloud(g, sx * (w / 2 - 30), sy * (h / 2 - 30), 13, sx < 0 ? 0 : PI, 2, sx * sy);
    opt.draw && opt.draw(g);

function cutText(g, txt, x, y, font, thick = 2.5) {
  g.save(); g.globalCompositeOperation = 'destination-out'; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = thick; g.lineJoin = 'round';
  g.fillText(txt, x, y); if (thick > 0) g.strokeText(txt, x, y); g.restore();
}
function dyeText(g, txt, x, y, font, col, thick = 2.5) { // a translucent dye insert behind cut letters
  g.save(); g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col; g.strokeStyle = col; g.lineWidth = thick; g.lineJoin = 'round';
  g.fillText(txt, x, y); if (thick > 0) g.strokeText(txt, x, y); g.restore();
}
function cutArrowDown(g, x, y, s) { cut(g, q => { P(q, [[x - s * .22, y - s * .6], [x + s * .22, y - s * .6], [x + s * .22, y], [x + s * .55, y], [x, y + s * .62], [x - s * .55, y], [x - s * .22, y]]); }); }

// ---------- figure parts ----------
function sleeve(L, w0, w1, dye, cuff, kind) {
  // limb segment from proximal joint (0,0) along +x
  const shape = q => { q.moveTo(0, w0 / 2); q.arc(0, 0, w0 / 2, PI / 2, PI * 1.5); q.lineTo(L, -w1 / 2); q.arc(L, 0, w1 / 2, -PI / 2, PI / 2); q.closePath(); };
  return piece([-w0 / 2 - 3, -Math.max(w0, w1) / 2 - 4, L + w1 / 2 + 3, Math.max(w0, w1) / 2 + 4], g => {
    fill(g, dye, shape);
    within(g, shape, () => {
      if (kind === 'scales') scalesOpen(g, w0 * .4, -w1, L - 6, w1, 6.5);
      else lattice(g, w0 * .45, -w1, L - 8, w1, 10, 2.4);
      if (cuff) { fill(g, cuff, q => q.rect(L - 20, -w1, 30, w1 * 2)); cutLine(g, 1.6, q => { q.moveTo(L - 12, -w1 / 2 + 5); q.lineTo(L - 12, w1 / 2 - 5); }); beadLine(g, L - 3, -w1 / 2 + 7, L - 3, w1 / 2 - 7, 2.2, 9); }

function hand(kind) {

    else if (kind === 'up') shape = q => S(q, [[0, -12], [18, -16], [22, -40], [28, -42], [30, -16], [34, -8], [32, 8], [22, 14], [6, 13], [0, 10]]);
    else shape = q => S(q, [[0, -12], [14, -16], [30, -16], [38, -8], [38, 8], [30, 15], [12, 15], [0, 11]]); // grip / fist
    fill(g, DYE.skin, shape);
    if (kind === 'grip') { ink(g, 1.5, q => { q.moveTo(28, -8); q.lineTo(36, -8); q.moveTo(27, 0); q.lineTo(37, 0); q.moveTo(27, 8); q.lineTo(35, 8); }); ink(g, 1.6, q => { q.moveTo(10, -14); q.quadraticCurveTo(24, -20, 30, -12); }); }
    if (kind === 'up') ink(g, 1.5, q => { q.moveTo(31, -2); q.lineTo(24, -2); q.moveTo(30, 6); q.lineTo(22, 6); });
    if (kind === 'point') ink(g, 1.5, q => { q.moveTo(30, 4); q.lineTo(22, 4); q.moveTo(28, 10); q.lineTo(20, 10); });

  });
}
function boot(pts) {
  return piece([-130, -130, 130, 6], g => { const sh = q => S(q, pts); fill(g, '#2a1a10', sh); cutLine(g, 2, q => { q.moveTo(pts[0][0] + 6, pts[0][1] + 16); q.lineTo(pts[1][0] - 6, pts[1][1] + 16); }); within(g, sh, () => { beadLine(g, -120, -8, 120, -8, 2.2, 9); }); ink(g, 2, sh); });

function collar(rw, dye) {

    const sh = q => { q.moveTo(-rw, 0); for (let i = 0; i <= 4; i++) { const x = -rw + i * rw / 2; q.quadraticCurveTo(x - rw / 4, 34, x + (i < 4 ? rw / 4 : 0), i < 4 ? 30 : 0); } q.lineTo(rw, -10); q.quadraticCurveTo(0, -24, -rw, -10); q.closePath(); };

// ---------- heads (facing +x, origin at neck base) ----------
function headZhang() {
  return piece([-100, -215, 72, 6], g => {
    const sil = [[0, -162], [18, -154], [34, -140], [41, -121], [37, -109], [43, -100], [58, -84], [47, -77], [49, -70], [37, -65], [47, -57], [43, -46], [34, -36], [17, -28], [12, 0], [-16, 0], [-22, -34], [-44, -62], [-52, -100], [-46, -134], [-28, -156]];
    const silF = q => S(q, sil);

    cut(g, q => S(q, [[22, -131], [33, -121], [32, -108], [36, -99], [43, -88], [37, -81], [35, -73], [29, -62], [33, -52], [27, -41], [13, -35], [1, -44], [-6, -62], [-6, -92], [0, -118], [10, -129]]));

    fill(g, DYE.ink, hair);
    cutLine(g, 1.6, q => { q.moveTo(-40, -130); q.quadraticCurveTo(-30, -100, -32, -60); q.moveTo(-28, -148); q.quadraticCurveTo(-18, -120, -20, -80); });
    // topknot bun + red cloth, tails flung up in shock
    fill(g, DYE.ink, q => q.arc(-16, -172, 17, 0, PI * 2));
    const cloth1 = q => S(q, [[-34, -170], [-22, -184], [2, -182], [6, -166], [-10, -160], [-30, -160]]);

  PC.zUpB = sleeve(116, 42, 34, '#b07a22', null, 'scales');
  PC.zLoB = sleeve(108, 34, 44, '#b07a22', DYE.verm, 'scales');
  PC.zHead = headZhang();
  PC.handGrip = hand('grip'); PC.handUp = hand('up'); PC.handPoint = hand('point');
  PC.stick = piece([-4, -6, 120, 6], g => { inkTaper(g, [[0, 0], [60, 0], [118, 0]], 7, '#3a2412'); });
  PC.jug = jugPiece();
  PC.snake4 = snakePiece(4, 232);
  PC.ground = groundPiece();
  PC.cloud = cloudPiece();
  PC.willow = willowPiece();
  // titles
  const FELL = s => `${s}px "IM Fell English"`;
  PC.hook = plaque(800, 196, { beads: true, corners: false, draw: g => {
    cutText(g, '4 characters.', 0, -40, FELL(88), 3);
    cutText(g, '1 crazy story.', 0, 46, FELL(88), 3);
    g.save(); g.font = FELL(88); const w1 = g.measureText('1 ').width, wA = g.measureText('1 crazy story.').width, wc = g.measureText('crazy').width; g.restore();
    dyeText(g, 'crazy', -wA / 2 + w1 + wc / 2, 46, FELL(88), '#ffb43a', 3);
  } });
  PC.guess = plaque(560, 84, { r: 40, dye: '#3a1009', line: '#c9922c', draw: g => {
    cutText(g, 'Guess the meaning', -34, 3, `italic ${54}px "IM Fell English"`, 2.4);
    cutArrowDown(g, 232, 2, 46);
  } });
  const chars = [['画', '#4a0f0a'], ['蛇', '#103a2a'], ['添', '#16264a'], ['足', '#3e2410']];
  PC.chars = chars.map(([ch, dye]) => plaque(250, 250, { dye, corners: true, r: 14, draw: g => { cutText(g, ch, 0, 8, '214px "LXGW WenKai"', 5); } }));
  PC.clues = ['brush', 'snake', 'plus', 'foot'].map(cluePiece);
  PC.chips = [['A', 'Overdoing it'], ['B', 'Being lucky'], ['C', 'Drawing well']].map(([k, s]) => plaque(560, 64, { r: 32, dye: '#2b170d', draw: g => {
    fill(g, DYE.gold, q => q.arc(-242, 0, 24, 0, PI * 2)); ink(g, 2, q => q.arc(-242, 0, 24, 0, PI * 2));
    cutText(g, k, -242, 2, FELL(38), 1.5); cutText(g, s, 30, 3, FELL(48), 2);
  } }));
  PC.tag = plaque(236, 70, { r: 10, dye: '#4a0f0a', draw: g => { cutText(g, '画蛇添足', 0, 4, '48px "LXGW WenKai"', 1.5); } });
  PC.caption = plaque(820, 250, { beads: true, corners: true, draw: g => {
    cutText(g, "Snakes don't", 0, -50, FELL(104), 3.4);
    cutText(g, 'have FEET!', 0, 58, FELL(112), 3.4);
    // FEET glows through a vermilion-orange dye insert
    g.save(); g.font = FELL(112); const wHave = g.measureText('have ').width, wAll = g.measureText('have FEET!').width, wF = g.measureText('FEET').width; g.restore();
    dyeText(g, 'FEET', -wAll / 2 + wHave + wF / 2, 58, FELL(112), '#ff9a2a', 3.4);
  } });
  // re-cut "crazy" letters in the hook so the gold insert sits only inside letter holes
}

// ---------- figure posing ----------
function ik(S0, Hd, L1, L2, bend) {
  const dx = Hd[0] - S0[0], dy = Hd[1] - S0[1]; let d = Math.min(Math.hypot(dx, dy), L1 + L2 - .5);
  const a = Math.atan2(dy, dx), c = Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
  const a1 = a + bend * Math.acos(c), E = [S0[0] + Math.cos(a1) * L1, S0[1] + Math.sin(a1) * L1];
  return { a1, a2: Math.atan2(Hd[1] - E[1], Hd[0] - E[0]), E };
}
function arm(M, sh, target, up, lo, L1, L2, bend, handP, handA, rivets) {
  const inv = M.inverse(), tl = inv.transformPoint(new DOMPoint(target[0], target[1]));
  const r = ik(sh, [tl.x, tl.y], L1, L2, bend);
  const mU = M.multiply(mat(sh[0], sh[1], r.a1)), mL = M.multiply(mat(r.E[0], r.E[1], r.a2));
  const wr = [r.E[0] + Math.cos(r.a2) * L2, r.E[1] + Math.sin(r.a2) * L2];
  const mH = M.multiply(mat(wr[0], wr[1], r.a2 + (handA || 0)));
  return { draw() { place(up, mU); place(lo, mL); if (handP) place(handP, mH); rivets.push(wp(M, ...sh), wp(M, ...r.E), wp(M, ...wr)); }, wrist: wp(M, ...wr), mH };
}

// ---------- the lamp ----------
function lamp(t, cx, cy) {
  const f = 1 + .035 * nz1(t * 7, 1) + .015 * Math.sin(t * 31);
  out.save(); out.setTransform(1, 0, 0, 1, 0, 0); out.globalCompositeOperation = 'source-over';
  const g1 = out.createRadialGradient(cx, cy, 0, cx, cy, 1300);
  const k = v => Math.min(255, Math.round(v * f));
  g1.addColorStop(0, `rgb(${k(255)},${k(246)},${k(226)})`); g1.addColorStop(.3, `rgb(${k(252)},${k(232)},${k(196)})`);
  g1.addColorStop(.62, `rgb(${k(236)},${k(196)},${k(140)})`); g1.addColorStop(1, `rgb(${k(170)},${k(112)},${k(62)})`);
  out.fillStyle = g1; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'lighter';
  const g2 = out.createRadialGradient(cx, cy, 0, cx, cy, 420); g2.addColorStop(0, `rgba(255,236,200,${.22 * f})`); g2.addColorStop(1, 'rgba(255,236,200,0)');
  out.fillStyle = g2; out.fillRect(0, 0, W, H);
  out.restore();
}
function post(t) {
  out.save(); out.setTransform(1, 0, 0, 1, 0, 0);
  out.globalCompositeOperation = 'multiply'; out.drawImage(Tc, 0, 0); out.drawImage(cloth(), 0, 0);
  // warm bloom
  const [bc, bg] = cv(W / 4, H / 4); bg.drawImage(out.canvas, 0, 0, W / 4, H / 4);
  out.globalCompositeOperation = 'screen'; out.globalAlpha = .28; out.filter = 'blur(10px)'; out.drawImage(bc, 0, 0, W, H); out.filter = 'none'; out.globalAlpha = 1;
  // warm vignette (toward brown, never grey)
  out.globalCompositeOperation = 'multiply';
  const v = out.createRadialGradient(W / 2, H * .45, H * .28, W / 2, H * .45, H * .72); v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(150,86,44,1)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = .18; out.drawImage(grain(), 0, 0); out.globalAlpha = 1;
  out.restore();
}
function stage() {
  // lacquered stage frame in front of the cloth, warm spill on inner edges; audience heads low and blurred
  out.save(); out.setTransform(1, 0, 0, 1, 0, 0); out.globalCompositeOperation = 'source-over';
  const wood = (x, y, w, h, vert) => { const gr = vert ? out.createLinearGradient(x, 0, x + w, 0) : out.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#2a120a'); gr.addColorStop(.5, '#4a1c0e'); gr.addColorStop(1, '#2a120a'); out.fillStyle = gr; out.fillRect(x, y, w, h); };
  wood(0, 0, W, 112); wood(0, 0, 26, H, true); wood(W - 26, 0, 26, H, true);
  // lintel fret and gold lines
  out.strokeStyle = '#b8832e'; out.lineWidth = 3; out.beginPath(); out.moveTo(26, 98); out.lineTo(W - 26, 98); out.moveTo(26, 22); out.lineTo(W - 26, 22); out.stroke();
  out.lineWidth = 2.4; out.strokeStyle = '#8f5f22'; out.beginPath();
  for (let x = 40; x < W - 40; x += 36) { out.moveTo(x, 80); out.lineTo(x, 40); out.lineTo(x + 24, 40); out.lineTo(x + 24, 66); out.lineTo(x + 10, 66); out.lineTo(x + 10, 54); }
  out.stroke();
  // spill on the inner edges
  let sp = out.createLinearGradient(0, 112, 0, 150); sp.addColorStop(0, 'rgba(60,24,8,.55)'); sp.addColorStop(1, 'rgba(60,24,8,0)'); out.fillStyle = sp; out.fillRect(26, 112, W - 52, 40);
  for (const [x0, x1] of [[26, 56], [W - 26, W - 56]]) { sp = out.createLinearGradient(x0, 0, x1, 0); sp.addColorStop(0, 'rgba(60,24,8,.5)'); sp.addColorStop(1, 'rgba(60,24,8,0)'); out.fillStyle = sp; out.fillRect(Math.min(x0, x1), 112, 30, H); }
  // bottom rail
  wood(0, 1500, W, 60); out.strokeStyle = '#b8832e'; out.lineWidth = 3; out.beginPath(); out.moveTo(0, 1508); out.lineTo(W, 1508); out.stroke();
  sp = out.createLinearGradient(0, 1500, 0, 1460); sp.addColorStop(0, 'rgba(60,24,8,.45)'); sp.addColorStop(1, 'rgba(60,24,8,0)'); out.fillStyle = sp; out.fillRect(26, 1460, W - 52, 40);
  // dark room + audience heads
  const rm = out.createLinearGradient(0, 1560, 0, H); rm.addColorStop(0, '#24120a'); rm.addColorStop(1, '#0e0704'); out.fillStyle = rm; out.fillRect(0, 1560, W, H - 1560);
  out.filter = 'blur(7px)'; out.fillStyle = '#070302';
  for (const [x, y, r] of [[90, 1760, 70], [270, 1720, 80], [470, 1780, 74], [660, 1730, 84], [860, 1770, 72], [1040, 1740, 78]]) { out.beginPath(); out.ellipse(x, y, r * .78, r, 0, 0, PI * 2); out.fill(); out.beginPath(); out.ellipse(x, y + r * 1.7, r * 1.8, r * 1.1, 0, 0, PI * 2); out.fill(); }
  out.filter = 'none';
  // rim of warm light on the heads
  out.globalCompositeOperation = 'lighter'; const rim = out.createLinearGradient(0, 1560, 0, 1700); rim.addColorStop(0, 'rgba(120,60,20,.35)'); rim.addColorStop(1, 'rgba(120,60,20,0)'); out.fillStyle = rim; out.fillRect(0, 1560, W, 140);
  out.restore();
}

// ---------- frames ----------
function tremor(t, k, a = 2) { return [a * nz1(t * 1.3, k), a * nz1(t * 1.1, k + 5), .012 * nz1(t * .9, k + 9)]; }

function frameA(t) {
  // hook plaque on two rods
  let [dx, dy, da] = tremor(t, 1, 1.5);
  let m = mat(470 + dx, 392 + dy, da * .4); place(PC.hook, m);
  rod(...wp(m, -300, 98), .22, 260); rod(...wp(m, 300, 98), .3, 260);
  [dx, dy, da] = tremor(t, 2, 1.5);
  m = mat(470 + dx, 552 + dy, da * .5); place(PC.guess, m);
  // character plaques 2x2, clue cut-outs pressed over their lower-right corners
  const cells = [[290, 724], [650, 724], [290, 1052], [650, 1052]];
  const gloss = [['huà', 'draw'], ['shé', 'snake'], ['tiān', 'add'], ['zú', 'feet']];
  const clueOff = [[136, 84, -.1], [140, 96, .06], [136, 92, .12], [136, 84, -.05]];
  cells.forEach(([cx, cy], i) => {
    const [x, y, a] = tremor(t, 10 + i, 1.8);
    const mp = mat(cx + x, cy + y, a + (i % 2 ? .02 : -.02)); place(PC.chars[i], mp);
    rod(...wp(mp, -125, 80), -.35, 160, 3);
    const [x2, y2, a2] = tremor(t, 20 + i, 2.4);
    const mc = mat(cx + clueOff[i][0] + x2, cy + clueOff[i][1] + y2, clueOff[i][2] + a2 * 2, 1.02, 1.02);
    place(PC.clues[i], mc);
    rivet(...wp(mc, 0, 0), 4.2);
  });
  return { gloss, cells };
}
function frameAText(t, info) {
  out.save(); out.setTransform(1, 0, 0, 1, 0, 0);
  info.cells.forEach(([cx, cy], i) => {
    const [py, en] = info.gloss[i];
    out.textAlign = 'left'; out.textBaseline = 'middle';
    out.font = 'bold 36px "DejaVu Sans"'; out.fillStyle = 'rgba(46,22,10,.92)';
    const y = cy + 156, x0 = cx - 118, wpy = out.measureText(py).width;
    out.fillText(py, x0, y);
    out.font = 'italic 44px "IM Fell English"'; out.fillStyle = 'rgba(120,28,14,.95)';
    out.fillText(en, x0 + wpy + 14, y + 1);
  });
  out.restore();
}
function frameAChips(t) {
  [1274, 1348, 1422].forEach((y, i) => { const [dx, dy, da] = tremor(t, 40 + i, 1.2); place(PC.chips[i], mat(460 + dx, y + dy, da * .3)); });
}

function frameB(t) {
  const rivets = [];
  const GY = 1092, FS = 1.14;                 // ground line, figure scale
  // scenery
  place(PC.willow, mat(1060, 112, 0, 1, 1));
  place(PC.cloud, mat(250, 400, 0, .9, .9), .9);
  place(PC.ground, mat(0, GY - 2));
  // corner tag
  const tagM = mat(44 + 118, 205); place(PC.tag, tagM); rod(...wp(tagM, 0, 34), .25, 80, 2.4);
  // the snake drawn on the ground (head left); its 4th foot is still being drawn
  const SX = 44, SK = 1.1; place(PC.snake4, mat(SX, GY, 0, SK, SK));
  const footTip = [SX + (30 + .72 * 232) * SK - 2, GY - 6];
  // --- Zhang: crouched facing left, head turned back to Li in shock ---
  const [zx, zy, za] = tremor(t, 3, 2.5);
  const ZM = mat(486 + zx, GY + zy * .3, za * .5, -FS, FS);
  const jugC = [598, 600];
  const [jx, jy, ja] = tremor(t, 7, 3);
  const jugM = mat(jugC[0] + jx, jugC[1] + jy, .2 + ja * 2, 1.15, 1.15);
  const zBack = arm(ZM, [54, -296], wp(jugM, -34, 56), PC.zUpB, PC.zLoB, 116, 108, Z_BACK_BEND, PC.handGrip, -1.2, rivets);
  zBack.draw();
  place(PC.zShinB, ZM); place(PC.zBootB, ZM);
  place(PC.zShinF, ZM); place(PC.zBootF, ZM);
  place(PC.zRobe, ZM); place(PC.zThigh, ZM);
  rivets.push(wp(ZM, -40, -84), wp(ZM, 108, -172));
  const zNeck = [72, -316];
  place(PC.zHead, ZM.multiply(mat(zNeck[0], zNeck[1], Z_HEAD_TILT, -1.3, 1.3)));
  place(PC.zCollar, ZM.multiply(mat(66, -310, .45)));
  rivets.push(wp(ZM, ...zNeck));
  // jug held between them (held piece on the hand line)
  place(PC.jug, jugM);
  // front arm reaching down to the snake with a twig
  const zFront = arm(ZM, [70, -292], [footTip[0] + 58, footTip[1] - 128], PC.zUpF, PC.zLoF, 116, 108, Z_FRONT_BEND, PC.handGrip, 0, rivets);
  zFront.draw();
  { const [hx, hy] = wp(zFront.mH, 22, 0), a = Math.atan2(footTip[1] - hy, footTip[0] - hx), L = Math.hypot(footTip[0] - hx, footTip[1] - hy);
    place(PC.stick, mat(hx, hy, a, L / 118, 1)); }
  // --- Li: stocky, standing, facing left, snatching the jug ---
  const [lx, ly, la] = tremor(t, 5, 2);
  const LM = mat(800 + lx, GY + ly * .3, la * .4 - .04, -FS, FS);
  const liBack = arm(LM, [-8, -430], wp(LM, -30, -290), PC.liUpB, PC.liLoB, 104, 98, L_BACK_BEND, PC.handGrip, 2.6, rivets);
  liBack.draw();
  place(PC.liBootB, LM); place(PC.liBootF, LM);
  place(PC.liRobe, LM);
  const liNeck = [10, -474];
  place(PC.liHead, LM.multiply(mat(liNeck[0], liNeck[1], -.22, 1.12, 1.12)));
  place(PC.liCollar, LM.multiply(mat(8, -470, -.05)));
  rivets.push(wp(LM, ...liNeck));
  const jh = wp(jugM, 46, -26);
  const liFront = arm(LM, [20, -430], [jh[0] + 16, jh[1] - 2], PC.liUpF, PC.liLoF, 104, 98, L_FRONT_BEND, PC.handGrip, .1, rivets);
  liFront.draw();
  for (const r of rivets) rivet(r[0], r[1], 4.6);
  // rods: neck + hands, angled toward the operators below
  rod(...wp(ZM, 50, -270), -.28, 420); rod(...zFront.wrist, -.08, 260); rod(...zBack.wrist, .1, 300);
  rod(...wp(LM, 0, -430), .26, 420); rod(...liFront.wrist, .2, 300); rod(...liBack.wrist, .3, 300);
  // caption: a carved title plaque pressed on below the ground strip
  const [cx, cy, ca] = tremor(t, 30, 1.2);
  place(PC.caption, mat(466 + cx, 1272 + cy, ca * .3));
}
const Z_BACK_BEND = -1, Z_FRONT_BEND = -1, L_BACK_BEND = 1, L_FRONT_BEND = 1, Z_HEAD_TILT = .16;

// ---------- render ----------
window.render = (t) => {
  if (!PC) build();
  T.setTransform(1, 0, 0, 1, 0, 0); T.globalCompositeOperation = 'source-over'; T.filter = 'none'; T.globalAlpha = 1;
  T.fillStyle = '#fff'; T.fillRect(0, 0, W, H);
  const isA = t < 5;
  let info;
  if (isA) { info = frameA(t); frameAChips(t); } else frameB(t);
  lamp(t, isA ? 520 : 560, isA ? 860 : 760);
  post(t);
  if (isA) frameAText(t, info);
  stage();
};

Promise.all([
  document.fonts.load('214px "LXGW WenKai"', '画蛇添足'),
  document.fonts.load('88px "IM Fell English"'), document.fonts.load('italic 54px "IM Fell English"'),
  document.fonts.load('bold 34px "DejaVu Sans"', 'huà shé tiān zú'),
]).then(() => { window.READY = true; });
</script></body></html>
